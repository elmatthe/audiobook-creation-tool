# ---------------------------------------------------------------------------
#  Audiobook Creation Tool - pytest configuration
#
#  This project's tests live in files/tests/ and nowhere else. `testpaths` makes
#  a bare `pytest` from the repository root collect exactly that tree - the same
#  tree `python scripts/verify.py` already runs by explicit path - so the
#  ordinary developer command and the authoritative gate cannot disagree about
#  what the suite is.
#
#  `norecursedirs` is the other half and is not redundant. `testpaths` applies
#  only when no path is given on the command line, so `pytest .` or
#  `pytest files` would still descend everywhere. files/dev-work/ is the
#  gitignored local workspace introduced by the 2026-08-29 containment policy;
#  it holds preserved evidence including a clean-room checkout carrying its own
#  copy of files/tests/. Being inside the repository for containment does not
#  make it active project source: collected from the root, those modules were
#  imported first and shadowed the real suite, turning 5160 passing tests into
#  158 import-file-mismatch errors plus 6 unimportable snapshots.
#
#  Patterns are fnmatch-matched against the directory BASENAME, so the entry is
#  `dev-work` rather than a path - which also keeps it correct on Windows,
#  macOS and Linux alike. `runtime-data` is excluded for the same reason and
#  is not new to this problem: files/runtime-data/ is application-owned local
#  state, and its retained phase14/tree-phase12/ snapshot has carried its own
#  copy of files/tests/ since 2026-08-22.
#  Setting this key REPLACES pytest's built-in defaults, so all nine are
#  repeated verbatim below; the two local-workspace names are the additions.
# ---------------------------------------------------------------------------
[pytest]
testpaths = files/tests
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} dev-work runtime-data
